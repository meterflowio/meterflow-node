name: Publish to npm
on:
  push:
    tags: ["node-v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*" # current LTS — keeps npm@latest installable (npm 12 needs Node >= 22.22 / 24.15)
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      # Trusted Publishing requires npm >= 11.5.1; track latest so OIDC support stays current
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: node -e "const { MeterFlow } = require('./dist/index.cjs'); console.log('smoke ok');"
      # Auth comes from the repo's OIDC identity (Trusted Publisher configured on
      # npmjs.com for meterflowio/meterflow-node + publish.yml) — no NPM_TOKEN.
      - run: npm publish --access public --provenance
